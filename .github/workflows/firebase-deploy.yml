name: Deploy to Firebase on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBDGxI4s4MyQDMhEMR2JM2KUBqpiKZiJdU"
          VITE_FIREBASE_AUTH_DOMAIN: "nat-gestao.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "nat-gestao"
          VITE_FIREBASE_STORAGE_BUCKET: "nat-gestao.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "79056473473"
          VITE_FIREBASE_APP_ID: "1:79056473473:web:83f41ee18a04ecbe65ec80"
        run: cd frontend && npm run build

      - name: Deploy to Firebase Hosting & Rules
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NAT_GESTAO }}
          channelId: live
          projectId: nat-gestao
